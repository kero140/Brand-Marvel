<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brand Marvel</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">BRAND <span>MARVEL</span></div>
  <button class="cart-btn" onclick="openCart()">🛒 السلة <b id="cartCount">0</b></button>
</header>

<section class="hero">
  <div>
    <p class="eyebrow">BRAND MARVEL</p>
    <h1>اختاري إطلالتك<br>بكل أناقة ✨</h1>
    <p>ملابس • إكسسوارات • SHEIN • قطع فورية</p>
    <a href="#products" class="primary">تسوقي الآن</a>
  </div>
</section>

<div class="shipping">🚚 شحن لجميع المحافظات</div>

<nav class="categories">
  <button class="active" onclick="filterProducts('all',this)">الكل</button>
  <button onclick="filterProducts('clothes',this)">ملابس</button>
  <button onclick="filterProducts('accessories',this)">إكسسوارات</button>
  <button onclick="filterProducts('shein',this)">SHEIN</button>
  <button onclick="filterProducts('instant',this)">⚡ القطع الفورية</button>
  <button onclick="filterProducts('offers',this)">🔥 عروض</button>
</nav>

<main id="products" class="container">
  <div class="section-head">
    <div><p class="eyebrow">NEW COLLECTION</p><h2>منتجاتنا</h2></div>
    <span id="productCount"></span>
  </div>
  <div id="productGrid" class="grid"></div>
</main>

<div id="cartModal" class="modal">
  <div class="modal-card">
    <button class="close" onclick="closeCart()">×</button>
    <h2>🛒 سلة المشتريات</h2>
    <div id="cartItems"></div>
    <div class="total">الإجمالي: <b id="cartTotal">0</b> جنيه</div>
    <div class="checkout">
      <input id="customerName" placeholder="الاسم">
      <input id="customerPhone" placeholder="رقم الهاتف">
      <textarea id="customerAddress" placeholder="العنوان بالتفصيل"></textarea>
      <textarea id="customerNotes" placeholder="ملاحظات (اختياري)"></textarea>
      <button class="whatsapp" onclick="checkout()">تأكيد الطلب عبر واتساب 💚</button>
    </div>
  </div>
</div>

<footer>© 2026 Brand Marvel — جميع الحقوق محفوظة</footer>
<script src="js/app.js"></script>
</body>
</html>
